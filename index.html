<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6fed" />
  <title>学贯 · K12 自学测评</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="appbar">
      <div class="appbar-title" id="appbarTitle">学贯</div>
      <div class="appbar-sub" id="appbarSub">幼儿园 → 高中 · 全科自学测评</div>
    </header>

    <!-- 主内容 -->
    <main id="view" class="view"></main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home"><span class="ico">📚</span><span>学习</span></button>
      <button class="tab" data-tab="books"><span class="ico">📖</span><span>正版教材</span></button>
      <button class="tab" data-tab="rank"><span class="ico">🏆</span><span>榜单</span></button>
      <button class="tab" data-tab="mine"><span class="ico">👤</span><span>我的</span></button>
    </nav>
  </div>

  <!-- 播放/学习浮层（认字卡、测验、考试共用） -->
  <div id="lessonLayer" class="layer hidden">
    <div class="layer-bar">
      <button id="layerBack" class="iconbtn">← 返回</button>
      <div id="layerTitle" class="layer-title"></div>
    </div>
    <div id="layerBody" class="layer-body"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/courses_more_1.js"></script>
  <script src="js/courses_more_2.js"></script>
  <script src="js/courses_math.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
