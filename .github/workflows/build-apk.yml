name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        # Capacitor 要求 webDir 是一个子目录，不能是仓库根目录 "."。
        # 这里把网页资源复制到 www/，仓库根目录（Pages 用）保持不变。
        run: |
          rm -rf www && mkdir -p www
          cp index.html manifest.webmanifest .nojekyll www/ 2>/dev/null || true
          cp -r js css assets www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Setup Android SDK (manual, avoid setup-android@v3 'tools' bug)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          # runner 预装了 SDK 并设了 ANDROID_SDK_ROOT；两个变量必须指向同一路径，否则 AGP 报 SDK 路径冲突
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # 关键：GITHUB_PATH 只对后续步骤生效，当前步骤必须显式 export PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xueguan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 学贯 v${{ github.ref_name }}
          body: |
            学贯 v${{ github.ref_name }} · Android 安装包
            - 下载 app-debug.apk，传到手机后允许「未知来源」安装即可使用
            - 数学已贯通 幼儿园→高三，含原创讲解 / 示意图 / 随堂测验 / 期末模拟考
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
