name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        # Capacitor 要求 webDir 是一个子目录，不能是仓库根目录 "."。
        # 这里把网页资源复制到 www/，仓库根目录（Pages 用）保持不变。
        run: |
          rm -rf www && mkdir -p www
          cp index.html manifest.webmanifest .nojekyll www/ 2>/dev/null || true
          cp -r js css assets www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xueguan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 学贯 v${{ github.ref_name }}
          body: |
            学贯 v${{ github.ref_name }} · Android 安装包
            - 下载 app-debug.apk，传到手机后允许「未知来源」安装即可使用
            - 数学已贯通 幼儿园→高三，含原创讲解 / 示意图 / 随堂测验 / 期末模拟考
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
